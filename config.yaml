# Конфигурация почтового агента
# Принцип из PLAN.md: адреса и настройки живут здесь, а не в коде.
# Секреты (логины, пароли приложений, токен Telegram) — только в .env.

llm:
  base_url: "http://localhost:11434/v1"  # Ollama; Docker переопределяет переменной LLM_BASE_URL
  model: "qwen3:14b"
  num_ctx: 16384      # окно контекста; по умолчанию Ollama даёт 4096 — промпт агента
                      # с инструментами занимает 2–4 тыс., история туда не влезала
  keep_alive: "24h"   # держать модель в памяти: выгрузка убивает кэш промпта,
                      # а с тёплым кэшем ответ 14b на CPU — секунды, без него — минуты

mail:
  batch_limit: 25          # не читаем больше N писем за раз
  default_account: ""      # ящик по умолчанию (имя из accounts, например "Google"); пусто — агент уточнит
  # Ящики по IMAP. Имя ящика — как его называть в диалоге; host — IMAP-сервер;
  # env — префикс переменных в .env: <env>_USER (логин) и <env>_PASS (пароль приложения).
  # port по умолчанию 993 (IMAP over TLS). Папки корзины и черновиков определяются
  # автоматически; при необходимости можно задать вручную полями trash и drafts.
  accounts:
    Google:
      host: imap.gmail.com
      env: IMAP_GOOGLE
    iCloud:
      host: imap.mail.me.com
      env: IMAP_ICLOUD
    Yandex:
      host: imap.yandex.ru
      env: IMAP_YANDEX

telegram:
  enabled: false    # используется ботом этапа 4

proactive:
  enabled: true              # фоновая проверка почты (этап 5)
  model: "qwen3:4b"          # модель фоновых задач (классификатор важности, разбор
                             # авто-правил). Отдельная от чата специально: у Ollama один
                             # слот кэша на модель, и запрос checker'а на той же модели
                             # вытеснял бы тёплый промпт бота (холодный вызов 14b на CPU —
                             # 5 минут). Пусто — та же модель, что у чата.
  think: true                # режим размышлений для фоновых задач: без него qwen3:4b
                             # отвечает прозой вместо JSON (проверено 04.09), с ним —
                             # ровно как 14b. Чат работает без размышлений ради скорости.
  check_interval_min: 15     # как часто проверять
  quiet_hours: "23:00-07:00" # тихие часы (локальное время); важное копится до утра
  digest_enabled: true       # утренний дайджест
  digest_time: "08:00"       # когда присылать дайджест
  cleanup_enabled: true      # авто-уборка по правилам «сам» (после дайджеста)
  cleanup_report_time: "20:00"  # вечерний вопрос «очистить корзину?»
