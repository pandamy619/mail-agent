# Конфигурация почтового агента
# Принцип из PLAN.md: адрес модели живёт здесь, а не в коде.
# Переезд на сервер = меняем base_url, код не трогаем.

llm:
  base_url: "http://localhost:11434/v1"  # OpenAI-совместимый API Ollama
  model: "qwen3:14b"                     # кандидат этапа 0; финализируем по тесту
  api_key: "ollama"                      # локально не проверяется, нужен клиенту

mail:
  batch_limit: 25          # не читаем больше N писем за раз (AppleScript медленный на больших выборках)
  default_account: ""      # ящик по умолчанию для Telegram-бота (например "Google"); пусто — бот уточнит в диалоге

telegram:
  enabled: false    # используется ботом этапа 4

proactive:
  enabled: true              # фоновая проверка почты (этап 5)
  check_interval_min: 15     # как часто проверять
  quiet_hours: "23:00-07:00" # тихие часы (локальное время мака); важное копится до утра
  digest_enabled: true       # утренний дайджест
  digest_time: "08:00"       # когда присылать дайджест
  cleanup_enabled: true      # авто-уборка по правилам «сам» (после дайджеста)
  cleanup_report_time: "20:00"  # вечерний вопрос «очистить корзину?»
